name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: basics-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Verify module and generated files
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          git diff --check
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          go test -race -count=1 ./...
          go vet ./...
          go build ./cmd
