name: CI

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: basics-resolver-catalog
  cancel-in-progress: false

jobs:
  test:
    strategy:
      matrix:
        go: ['stable']
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Refresh embedded encrypted DNS endpoint catalog
        run: |
          set -euo pipefail
          go run ./cmd/update-resolver-endpoints \
            -input network/resolver/endpoints_sources.json \
            -output network/resolver/endpoints_embed.json \
            -timeout 4s \
            -concurrency 6

      - name: Test
        run: |
          set -euo pipefail
          go test -race -count=1 ./... -coverprofile=coverage.txt
          go vet ./...
          git diff --check

      - name: Commit refreshed encrypted DNS endpoint catalog
        if: success()
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- network/resolver/endpoints_embed.json)" ]]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add network/resolver/endpoints_embed.json
          git commit -m "chore: refresh encrypted DNS endpoint catalog"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Create Tag
        if: success() # 仅在测试成功时运行
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          VERSION="$(go run ./cmd -v | tail -n 1 | tr -d '\r')"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid component version: $VERSION" >&2
            exit 1
          fi
          TAG="$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Release tag already exists: $TAG" >&2
            exit 1
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "TAG=$TAG" >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README.md
        if: success() # 仅在测试成功后运行
        run: |
          sed -i "s|go get github.com/oneclickvirt/basics@.*|go get github.com/oneclickvirt/basics@${TAG}|" README.md
        env:
          TAG: ${{ env.TAG }}

      - name: Commit and Push README.md
        if: success() # 仅在测试成功后运行
        run: |
          set -euo pipefail
          git add README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update README.md with new tag ${TAG}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
